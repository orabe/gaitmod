name: gaitmod-cluster
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.24.3
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - mne
  - pyyaml
  - seaborn
  - tqdm
  - pydot
  - tabulate
  - antropy
  - imbalanced-learn

  - pip:
    # Core runtime (CPU). For GPU clusters, install an appropriate tensorflow/cuda wheel
    # - "tensorflow==2.16.2"
    # PyPI-only packages
    - cliffs-delta
    - "-e ."